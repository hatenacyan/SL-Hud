<script>
let currentPage = 0;
const itemsPerPage = 10;
let cachedData = null;

const urlParams = new URLSearchParams(window.location.search);
const slServer = urlParams.get('sl_url');

if (!slServer) {
    document.getElementById('user-list').innerHTML = "<div style='color:#ff6b6b;padding:8px;'>バックエンドURL未設定（Second LifeのHUDから開いてください）</div>";
}

function renderList() {
    if (!cachedData) return;
    const listContainer = document.getElementById('user-list');
    listContainer.innerHTML = '';
    
    document.getElementById('header-title').textContent = 'Status (' + cachedData.users.length + ')';

    let rows = cachedData.users.map((u, i) => {
        let st = cachedData.statuses[i] || '0';
        return {
            index: i,
            uuid: u.uuid,
            name: u.name,
            status: st === '1' ? '1' : '0'
        };
    });

    rows.sort((a, b) => {
        if (a.status !== b.status) {
            return parseInt(b.status) - parseInt(a.status);
        }
        return a.index - b.index;
    });

    const totalPages = Math.max(1, Math.ceil(rows.length / itemsPerPage));
    if (currentPage >= totalPages) currentPage = totalPages - 1;

    const startIdx = currentPage * itemsPerPage;
    const pageRows = rows.slice(startIdx, startIdx + itemsPerPage);

    if (rows.length === 0) {
        listContainer.innerHTML = "<div style='color:#ff6b6b;padding:8px;'>有効なユーザーが見つかりません</div>";
        return;
    }

    pageRows.forEach(r => {
        const profile_url = "secondlife:///app/agent/" + r.uuid + "/about";
        const initial_char = r.name.charAt(0).toUpperCase();
        
        const rowDiv = document.createElement('div');
        rowDiv.className = 'user-row';
        rowDiv.innerHTML = `
            <span class='status-dot ${r.status === '1' ? 'online' : 'offline'}'></span>
            <div class='avatar-icon'>${initial_char}</div>
            <a class='name-link' href='${profile_url}'>${r.name}</a>
        `;
        listContainer.appendChild(rowDiv);
    });

    document.getElementById('page-indicator').textContent = (currentPage + 1) + ' / ' + totalPages + ' ページ';
}

// JSONP用のコールバック関数
function handleData(data) {
    cachedData = data;
    renderList();
}

function updateStatuses() {
    if (!slServer) return;
    const oldScript = document.getElementById('jsonp-script');
    if (oldScript) oldScript.remove();

    const script = document.createElement('script');
    script.id = 'jsonp-script';
    script.src = slServer + '/api/data?callback=handleData';
    document.body.appendChild(script);
}

document.getElementById('prev-page').onclick = () => {
    if (!cachedData) return;
    const totalPages = Math.max(1, Math.ceil(cachedData.users.length / itemsPerPage));
    currentPage = (currentPage - 1 + totalPages) % totalPages;
    renderList();
};

document.getElementById('next-page').onclick = () => {
    if (!cachedData) return;
    const totalPages = Math.max(1, Math.ceil(cachedData.users.length / itemsPerPage));
    currentPage = (currentPage + 1) % totalPages;
    renderList();
};

document.getElementById('size-select').onchange = (e) => {
    document.body.classList.remove('size-small', 'size-medium', 'size-large');
    document.body.classList.add(e.target.value);
};

document.getElementById('font-select').onchange = (e) => {
    document.body.classList.remove('font-meiryo', 'font-gothic', 'font-rounded', 'font-mincho');
    document.body.classList.add(e.target.value);
};

document.getElementById('interval-select').onchange = (e) => {
    if (slServer) {
        fetch(slServer + '/api/set_interval?sec=' + e.target.value).catch(err => {});
    }
};

document.getElementById('close-btn').onclick = () => {
    if (slServer) {
        fetch(slServer + '/api/detach').catch(err => {});
    }
};

setInterval(updateStatuses, 2500);
updateStatuses();
</script>
