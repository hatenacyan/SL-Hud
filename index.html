<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
        user-select: none;
    }

    .wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 8px;
    }

    .header {
        flex-shrink: 0;
        height: 38px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #444;
        padding-bottom: 4px;
        margin-bottom: 6px;
    }

    .header > span {
        font-size: 20px;
        font-weight: bold;
        color: #fff;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #user-list {
        flex-grow: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .user-row {
        display: flex;
        align-items: center;
        background: #2a2a2a;
        padding: 0 8px;
        border-radius: 4px;
        height: 32px;
        width: 100%;
        flex-shrink: 0;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 8px;
        flex-shrink: 0;
    }

    .online { background-color: #4CAF50; }
    .offline { background-color: #777; }

    .name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
        flex-grow: 1;
        font-size: 13px;
    }

    body.font-small .name { font-size: 11px; }
    body.font-medium .name { font-size: 13px; }
    body.font-large .name { font-size: 16px; }

    .font-btn, .nav-btn {
        background: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        text-align: center;
        font-size: 12px;
    }

    .font-btn {
        padding: 2px 6px;
    }

    .font-btn:active, .nav-btn:active {
        background: #555;
    }

    .nav-footer {
        flex-shrink: 0;
        height: 32px;
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
    }

    .nav-btn {
        height: 100%;
        width: 48%;
    }

    .error-box {
        color: #ff6b6b;
        padding: 10px;
        background: #400;
        border-radius: 4px;
        word-break: break-all;
    }
</style>
</head>
<body class="font-medium">
    <div class="wrapper">
        <div class="header">
            <span>Status HUD</span>
            <div class="header-right">
                <button class="font-btn" id="font-toggle-btn">文字: 標準</button>
                <span id="page-info">1/5</span>
            </div>
        </div>
        <div id="user-list">データを取得中...</div>
        <div class="nav-footer">
            <button class="nav-btn" id="prev-btn">◀ 前へ</button>
            <button class="nav-btn" id="next-btn">次へ ▶</button>
        </div>
    </div>
    <script>
        (async function() {
            let allUsers = [];

            try {
                // 同じリポジトリ内に配置する 'users.json' からデータを取得
                const response = await fetch('users.json?' + new Date().getTime());
                if (!response.ok) throw new Error('データファイルの取得に失敗しました');
                const data = await response.json();
                allUsers = data.users || [];
            } catch (err) {
                // 取得失敗時のフォールバック（テスト用データ）
                for (let i = 1; i <= 50; i++) {
                    allUsers.push({ n: "取得エラー / ユーザー " + i, o: false });
                }
            }

            const fontModes = [
                { class: "font-small", label: "文字: 小" },
                { class: "font-medium", label: "文字: 標準" },
                { class: "font-large", label: "文字: 大" }
            ];

            let currentFontIdx = 1;
            try {
                const saved = localStorage.getItem('hud_font_idx');
                if (saved !== null) {
                    currentFontIdx = parseInt(saved, 10);
                    if (currentFontIdx < 0 || currentFontIdx >= fontModes.length) currentFontIdx = 1;
                }
            } catch (e) {}

            function applyFontSettings() {
                const mode = fontModes[currentFontIdx];
                document.body.className = mode.class;
                const btn = document.getElementById('font-toggle-btn');
                if (btn) btn.textContent = mode.label;
                try {
                    localStorage.setItem('hud_font_idx', currentFontIdx);
                } catch (e) {}
            }

            function updateDisplay() {
                applyFontSettings();

                const params = new URLSearchParams(window.location.search);
                let pageNum = parseInt(params.get('page'), 10) || 1;
                if (pageNum < 1) pageNum = 1;
                if (pageNum > 5) pageNum = 5;

                document.getElementById('page-info').textContent = pageNum + "/5";

                const container = document.getElementById('user-list');
                container.innerHTML = '';

                const startIdx = (pageNum - 1) * 10;
                const pageUsers = allUsers.slice(startIdx, startIdx + 10);

                if (pageUsers.length === 0) {
                    container.innerHTML = '<div class="error-box">表示するユーザーがいません</div>';
                    return;
                }

                pageUsers.forEach(user => {
                    const row = document.createElement('div');
                    row.className = 'user-row';
                    const dot = document.createElement('div');
                    dot.className = 'status-dot ' + (user.o ? 'online' : 'offline');
                    const nameSpan = document.createElement('div');
                    nameSpan.className = 'name';
                    nameSpan.textContent = user.n;
                    row.async = false;
                    row.appendChild(dot);
                    row.appendChild(nameSpan);
                    container.appendChild(row);
                });
            }

            document.getElementById('font-toggle-btn').onclick = (e) => {
                e.stopPropagation();
                currentFontIdx = (currentFontIdx + 1) % fontModes.length;
                applyFontSettings();
            };

            document.getElementById('prev-btn').onclick = () => {
                const params = new URLSearchParams(window.location.search);
                let pageNum = parseInt(params.get('page'), 10) || 1;
                let prev = pageNum - 1;
                if (prev < 1) prev = 5;
                window.location.search = '?page=' + prev;
            };

            document.getElementById('next-btn').onclick = () => {
                const params = new URLSearchParams(window.location.search);
                let pageNum = parseInt(params.get('page'), 10) || 1;
                let next = pageNum + 1;
                if (next > 5) next = 1;
                window.location.search = '?page=' + next;
            };

            updateDisplay();
        })();
    </script>
</body>
</html>
